name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra app --extra dev
      # Models are not downloaded here, so the end-to-end tests skip themselves.
      - run: uv run pytest -v
      - name: Import every module (catches Windows-only import errors)
        if: runner.os == 'Windows'
        run: uv run python -c "import valoroyce.cli, valoroyce.audio, valoroyce.overlay, valoroyce.compose, valoroyce.hotkey, valoroyce.setup, valoroyce.catalog, valoroyce.settings, valoroyce.starter; import soundcard; print('imports ok')"
  installer:
    # The Windows installer, built the same way as by hand; kept with the run.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra app
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: powershell -ExecutionPolicy Bypass -File installer\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Valoroyce-Setup
          path: dist/Valoroyce-Setup-*.exe
          retention-days: 30
