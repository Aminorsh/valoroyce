# Copy to config.toml and edit. Every key is optional; the values shown are the defaults.
# 复制为 config.toml 再修改。所有项都可以省略，下面写的就是默认值。

# Where models and the llama.cpp runtime are stored. 模型存放目录
models_dir = "models"

[audio]
# "loopback" = what the PC is playing 电脑正在播放的声音
# "mic"      = an input device 麦克风
# "file"     = a WAV file (set `file`) 音频文件
source = "loopback"
# Part of the device name, see `valoroyce devices`. Empty = system default.
# 设备名的一部分；留空用系统默认设备
device = ""
# Listen to one program only, by its file name, e.g. "RiotClientServices.exe";
# see `valoroyce devices`. Empty = every program. When set, `device` is not used.
# 只听某一个程序的声音（填程序文件名）；留空 = 所有程序。设置后 device 不再起作用
app = ""
# "only" = just that program 只听它; "except" = everything but it, e.g. a
# voice-call program 除了它以外的全部声音（例如排除语音通话软件）
app_mode = "only"
file = ""
realtime = true

[vad]
threshold = 0.5
# Silence (seconds) that ends a sentence. Lower = faster captions, more fragments.
# 静音多久算一句话说完。越小字幕越快，但更容易把一句话切碎
min_silence = 0.35
min_speech = 0.2
# Sentences longer than this are cut. 超过这么长强制断句
max_speech = 8.0

[asr]
# Which recogniser listens.
# "whisper"    = Whisper on an NVIDIA graphics card: the accurate one. Needs its
#                model (valoroyce setup --whisper) and about 1.3 GB of the card's memory.
# "whispercpp" = the same Whisper through whisper.cpp (Vulkan): AMD and Intel cards too.
# "sensevoice" = SenseVoice on the CPU: runs anywhere, much less accurate on real voice chat.
# "auto"       = the first recogniser of `order` that can run here.
# 语音识别模型："whisper" 用 NVIDIA 显卡，准确得多（需要先下载模型，占约 1.3 GB 显存）；
# "whispercpp" 是同一个 Whisper 换成 whisper.cpp（Vulkan）运行，AMD / Intel 显卡也能用；
# "sensevoice" 用 CPU，哪里都能跑但对真实语音差很多；"auto" 按 order 的顺序用第一个能用的
backend = "auto"
# backend = "auto": the recognisers to try, in this order. One that is left out
# is never used, even if its model is downloaded. Also set in the settings window.
# "auto" 时按这个顺序尝试；没写进来的模型即使下载了也不会用（设置窗口里也能调）
order = ["whisper", "whispercpp", "sensevoice"]
# Expected languages, default first. ["ja"] alone is the most stable.
# 预期出现的语言，第一个是默认语言
languages = ["ja", "en"]
# While someone is talking, recognise again this often (seconds): shows a live
# caption and finishes the phrases of a long sentence early. 0 = only at pauses.
# 说话过程中每隔多久重新识别一次：显示进行中的字幕，并让长句的前半句提前定稿；0 表示只在停顿时出字幕
partial_interval = 1.0
# Whisper: model folder inside models_dir, and number format on the card
# ("int8_float16" needs half the memory of "float16").
# Whisper 模型所在的文件夹（在 models_dir 里），以及显存里的数值格式
whisper_model = "whisper-large-v3-turbo"
whisper_compute = "int8_float16"
# Whisper on other graphics cards (AMD, Intel; whisper.cpp with Vulkan): model file.
# AMD / Intel 显卡上的 Whisper（whisper.cpp，Vulkan）：模型文件
whispercpp_model = "whisper-ggml/ggml-large-v3-turbo-q8_0.bin"
# SenseVoice: CPU threads and onnxruntime provider.
num_threads = 2
provider = "cpu"

[translate]
# "llama"  = start the bundled local model 自动启动本地翻译模型
# "openai" = use a server you run at base_url 使用你自己启动的模型服务
# "none"   = glossary substitution only 只替换术语，不翻译
backend = "llama"
target = "中文"
base_url = "http://127.0.0.1:8177"
api_key = ""
model = "hy-mt2"
# "hy-mt" for Hy-MT models, "generic" for any other chat model.
prompt = "hy-mt"
# Translate half-finished captions too. Turn off on a weak CPU.
# 是否翻译半句字幕；CPU 吃紧时关掉
partials = true
max_tokens = 96
timeout = 8.0
# Extra fields added to every request, for servers that need them,
# e.g. { thinking = { type = "disabled" } } to switch off a model's thinking phase.
extra_body = {}
# backend = "llama" only.
# Caption model file inside models_dir. "" = the bundled one.
model_file = ""
# Run translation on the graphics card: faster, but shares the card with the game.
# Set false if the game stutters. Also switchable from the tray menu.
# 翻译模型是否用显卡跑：更快，但会和游戏抢显卡；游戏掉帧就改成 false（托盘菜单里也能切换）
gpu = true
# Layers placed on the GPU when gpu = true, CPU threads, extra llama-server flags.
gpu_layers = 99
threads = 4
server_args = []

[translate.custom]
# A caption model of your own, tried first; the model above takes over any
# sentence it fails on or does not answer within `timeout` seconds.
# 自定义字幕翻译模型：优先使用；它出错、拒绝或超时的句子由上面的模型（Hy-MT2）翻译
#   ""        none 不使用
#   "openai"  a server that speaks OpenAI's API: Ollama, LM Studio, or an online
#             service. An online service receives EVERY sentence that is heard,
#             and some services alter sentences on some topics without saying so.
#             兼容 OpenAI 接口的服务。在线服务会收到听到的每一句话，有的服务会悄悄改写某些话题的句子
#   "llama"   a .gguf file of your own in models_dir, served at base_url (own port)
#             自己的 .gguf 模型文件，用单独的端口
backend = ""
# Ollama: http://127.0.0.1:11434   LM Studio: http://127.0.0.1:1234
base_url = "http://127.0.0.1:11434"
# The key can also be set as the environment variable VALOROYCE_CAPTION_API_KEY.
api_key = ""
model = ""
# "generic" for any chat model, "hy-mt" for Hy-MT models.
prompt = "generic"
timeout = 2.5
# Send half-finished captions too (many more requests). Off: those stay on the model above.
# 半句字幕也发给它（请求会多很多）；关闭时半句仍由上面的模型翻译
partials = false
extra_body = {}
model_file = ""

[glossary]
# Your own term files, merged over the built-in list. 自己的术语文件
extra = []
# Snap near-miss spellings onto known names. 自动纠正近似写法
fuzzy = true

[overlay]
enabled = true
font_family = "Microsoft YaHei"
font_size = 22
# Rows of captions on screen at most; older captions leave first, and one that
# is longer shows its end. More rows reach further up, towards the crosshair.
# 屏幕上最多几行字幕：旧的先消失，过长的一条只显示后半；行数越多越往上挡视野
max_lines = 3
# Seconds a finished caption stays. 整句字幕停留秒数
linger = 6.0
# Show the recognised Japanese / English above the Chinese. 同时显示原文
show_source = false
# Position as fractions of the screen: centre x, bottom edge y, width.
# 位置（占屏幕的比例）：水平中心、底边高度、宽度。也可在托盘菜单里拖动调整
x = 0.5
y = 0.82
width = 0.5
# Background darkness, 0 to 1. 背景不透明度
opacity = 0.72

[compose]
# Type Chinese, get a message for teammates. "ja" or "en".
# 发消息功能：把你打的中文翻译成 "ja"（日语）或 "en"（英语）
target = "ja"
# System-wide shortcut that opens the message box (Windows). "" = none.
# 打开发消息窗口的全局快捷键（Windows）；留空则不注册
hotkey = "ctrl+alt+t"
# Which model writes your messages. Captions are not affected.
#   ""        the caption model (nothing extra to set up)
#   "llama"   a second local model: model_file (a .gguf inside models_dir)
#   "openai"  a server or online service that speaks OpenAI's API: base_url, model, api_key.
#             An online service receives the text you type, nothing else.
# 发消息用哪个模型（不影响字幕）：留空 = 和字幕共用；"llama" = 本地第二个模型；
# "openai" = 兼容 OpenAI 接口的服务（在线服务只会收到你输入的那句话）
backend = ""
model_file = ""
base_url = "http://127.0.0.1:8178"
# The key can also be set as the environment variable VALOROYCE_COMPOSE_API_KEY.
api_key = ""
model = ""
# "generic" for any chat model, "hy-mt" for Hy-MT models.
prompt = "generic"
timeout = 30.0
# Extra request fields, as in [translate]. A model that "thinks" before answering
# needs that switched off here, or replies come back empty.
extra_body = {}
# A message containing any of these words is translated by the caption model and
# never sent to the model above. Hosted services decline or alter sentences on
# some topics; list the words that give you trouble.
# 包含这些词的句子不会发给上面的模型，直接由本地字幕模型翻译；可自行增减
local_only = ["台湾"]
