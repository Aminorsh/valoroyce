# Built-in VALORANT glossary: what players say (ja / en) -> the mainland-China
# client's wording (zh).
#
#   zh       the Chinese shown in captions
#   kind     agent | weapon | map : names. Always forced into the caption.
#            callout              : slang. Offered to the translator as a hint only.
#   en / ja  spellings as the speech recogniser writes them; the first is canonical
#   mishear  wrong transcriptions seen in practice, rewritten to the canonical
#            spelling before translation
#   zh_alias other ways players write it in Chinese, such as nicknames (保安 for
#            零). Used only when translating the player's own messages; captions
#            always show zh. A one-character alias needs a site letter in front
#            ("A大"), or a required lead-in written in brackets: "(有)大" matches
#            the 大 in 有大. Latin aliases ("AK") match in any letter case.
#
# Chinese names follow the 无畏契约 client (checked against wiki.biligame.com/valorant,
# 2026-11). Entries marked "unverified" are best guesses for the Japanese spelling.
#
# Add your own in a separate file and list it under [glossary] extra = [...] ;
# an entry with the same zh replaces the built-in one.

