[project]
name = "valoroyce"
version = "0.1.0"
description = "Offline live captions for VALORANT voice chat: Japanese/English speech -> Chinese subtitles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
# Live capture of what the PC is playing (WASAPI loopback on Windows).
capture = ["soundcard>=0.4.3"]
# The on-screen caption window.
overlay = ["PySide6-Essentials>=6.7"]
# Everything a player needs.
app = ["valoroyce[capture,overlay]"]
dev = ["pytest>=8"]

[project.scripts]
valoroyce = "valoroyce.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valoroyce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
