[project]
name = "valoroyce"
version = "0.5.0"
description = "Offline live captions for VALORANT voice chat: Japanese/English speech -> Chinese subtitles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
]

[project.optional-dependencies]
# Live capture of what the PC is playing (WASAPI loopback on Windows).
capture = ["soundcard>=0.4.3"]
# The on-screen caption window.
overlay = ["PySide6-Essentials>=6.7"]
# Everything a player needs.
app = ["valoroyce[capture,overlay]"]
# Speech recognition with Whisper on an NVIDIA graphics card (about 1.3 GB of
# libraries). Without it recognition runs on the CPU with a smaller model.
whisper = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]
dev = ["pytest>=8"]

[project.scripts]
valoroyce = "valoroyce.cli:entry"

# The same program without a console window, for shortcuts.
[project.gui-scripts]
valoroyce-gui = "valoroyce.cli:gui"

[tool.uv]
# The NVIDIA libraries ship no source: only versions that have a Windows build
# may be locked.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valoroyce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
